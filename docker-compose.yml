services:
  client:
    build:
      context: .
      dockerfile: ./docker/client.Dockerfile
      target: ${DOCKER_TARGET:-local}
    ports:
      - 3000:3000
    tty: true
    command: npm run dev
    working_dir: /client
    volumes:
      - type: bind
        source: ./client
        target: /client
      - type: bind
        source: ~/.cconfig/gcloud/application_default_credentials.json
        target: /application_default_credentials.json
      - type: volume
        source: reactflow_client_node_modules
        target: /client/node_modules
    environment:
      NODE_ENV: local
      PORT: 3000
      BIND_HOST: 0.0.0.0
      GOOGLE_APPLICATION_CREDENTIALS: './application_default_credentials.json'

volumes:
  reactflow_client_node_modules:
